screen = <profile> [LIGHTING] [SHADOWS] [COLOR]
screen.columns = 2
screen.LIGHTING = EXPOSURE BLOCKLIGHT_STRENGTH NIGHT_BRIGHTNESS
screen.SHADOWS = shadowMapResolution SHADOW_SAMPLES SHADOW_SOFTNESS
screen.COLOR = SATURATION BLOOM_STRENGTH FOG_STRENGTH

screen.LIGHTING.columns = 1
screen.SHADOWS.columns = 1
screen.COLOR.columns = 1

sliders = EXPOSURE BLOCKLIGHT_STRENGTH NIGHT_BRIGHTNESS SHADOW_SOFTNESS SATURATION BLOOM_STRENGTH FOG_STRENGTH

profile.SOFT = SHADOW_SAMPLES=4 SHADOW_SOFTNESS=1.5 BLOOM_STRENGTH=0.04
profile.COZY = SHADOW_SAMPLES=4 SHADOW_SOFTNESS=1.8 BLOOM_STRENGTH=0.07
profile.HIGH = SHADOW_SAMPLES=8 SHADOW_SOFTNESS=2.2 BLOOM_STRENGTH=0.08

shadow.enabled = true
clouds = fancy
oldLighting = false

# Half-resolution HDR target used only by the bloom extraction pass.
size.buffer.colortex3 = 0.5 0.5
