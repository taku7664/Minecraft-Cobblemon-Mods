<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빡켓몬 모의 전투</title>
<style>
/*__FONTS__*/
/*
 * Layout: Pokemon Diamond/Pearl's two screens, one above the other - the battle scene (foe HP box top left, foe on its
 * platform top right, my back sprite bottom left, my HP box right, the message box along the bottom) and the touch
 * menu (FIGHT, BAG, RUN, POKEMON; the four moves; the party). The turn's results print below both screens.
 * Around them the wiki's ds_window look in the tower_lobby palette (server-wiki/assets/wiki.css).
 */
:root {
  --backdrop: #141c26; --shell: #5a6e84; --title-bar: #34435a; --panel: #eef1f2; --panel-alt: #d6dadc;
  --panel-text: #283440; --panel-text-dim: #5a6878; --border: #283440; --frame-highlight: #ffffff; --frame-shade: #9aa6b0;
  --trim: #c04038; --info-band: #8098b0; --primary: #2c9ccc; --primary-pressed: #1e7aa6; --selected: #ecbc2c;
  --good: #4fa860; --danger: #c04038; --text: #f2f5f8; --text-dim: #a9b8c8; --cursor: #f07820;
  --hp-green: #58d080; --hp-yellow: #f8c838; --hp-red: #f05838;
  --font: "Wiki Galmuri", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--backdrop); }
body {
  margin: 0; min-height: 100vh; color: var(--panel-text); font: 15px/1.6 var(--font);
  background: radial-gradient(circle at 20% 0%, rgba(90, 110, 132, .35), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 4px), var(--backdrop);
  padding-block: max(10px, env(safe-area-inset-top, 0px)) 24px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.shell { max-width: 520px; margin: 0 auto; background: var(--shell); border: 2px solid var(--border); border-radius: 6px;
  box-shadow: inset 0 0 0 2px var(--frame-shade), 0 6px 0 rgba(0, 0, 0, .35); padding: 6px; }
.titlebar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--title-bar);
  border-radius: 4px 4px 0 0; border-bottom: 3px solid var(--trim); color: var(--text); }
.titlebar strong { font-size: 17px; letter-spacing: .04em; }
.titlebar span { color: var(--selected); font-size: 12px; letter-spacing: .2em; }
.titlebar .id { margin-left: auto; color: var(--text-dim); font-size: 11px; letter-spacing: 0; }
.body { background: var(--panel); border-radius: 0 0 4px 4px; padding: 8px; display: grid; gap: 8px; }

/* ---- The DS ---------------------------------------------------------------------------------------------------- */
.ds { background: #2a2f36; border: 2px solid var(--border); border-radius: 10px; padding: 8px; display: grid; gap: 10px;
  box-shadow: inset 0 0 0 2px #4a525c; }
.screen { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; container-type: inline-size;
  border: 2px solid #11151a; border-radius: 2px; image-rendering: pixelated; user-select: none; -webkit-user-select: none; }
.screen > * { position: absolute; }

/* Top screen: the battle scene. */
.scene { background:
  linear-gradient(180deg, #f8f8e8 0%, #e0f0c8 22%, #b8e0a0 40%, #98d088 41%, #88c878 70%, #78b868 100%); }
.scene .stripe { left: 0; right: 0; top: 41%; height: 1.2%; background: rgba(255, 255, 255, .35); }
.platform { border-radius: 50%; background: radial-gradient(ellipse at 50% 45%, #c8e8a8 0 45%, #a0d088 46% 70%, #78a868 71%); }
.platform.foe { left: 53%; width: 44%; top: 34%; height: 11%; }
.platform.me { left: -4%; width: 58%; top: 66%; height: 14%; }
.sprite { image-rendering: pixelated; pointer-events: none; }
.sprite.foe { left: 57%; width: 36%; bottom: 58%; }
.sprite.me { left: 3%; width: 46%; bottom: 26%; }
.sprite.gone { opacity: 0; }
.hpbox { background: #f8f8f0; border: .6cqw solid #404848; color: #303838; padding: 1.2cqw 2.4cqw 1.4cqw;
  box-shadow: inset 0 -.8cqw 0 #c8c8b8; font-size: 4.2cqw; line-height: 1.15; }
.hpbox.foe { left: 0; top: 5%; width: 52%; border-left: 0; border-radius: 0 3cqw 3cqw 0; }
.hpbox.me { right: 0; top: 43%; width: 52%; border-right: 0; border-radius: 3cqw 0 0 3cqw; }
.hpbox .row { position: relative; display: flex; align-items: baseline; gap: 1.4cqw; white-space: nowrap; }
.hpbox .row > * { position: static; }
.hpbox .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.hpbox .lv { font-size: 3.6cqw; }
.male { color: #3070e0; } .female { color: #e04848; }
.hpbox .bar { position: relative; display: flex; align-items: center; gap: 1cqw; margin-top: .8cqw; }
.hpbox .bar b { position: static; font-size: 2.8cqw; color: #f8b018; background: #484848; padding: 0 .8cqw; border-radius: .6cqw; }
.hpbox .track { position: relative; flex: 1; height: 2.2cqw; background: #505858; border: .4cqw solid #303838; border-radius: 1cqw; overflow: hidden; }
.hpbox .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hp-green); transition: width .5s; }
.hpbox .track i.mid { background: var(--hp-yellow); } .hpbox .track i.low { background: var(--hp-red); }
.hpbox .nums { position: static; display: block; text-align: right; font-size: 3.8cqw; margin-top: .6cqw; }
.hpbox .stg { position: static; display: block; font-size: 3cqw; color: #606868; margin-top: .4cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { position: static; font-size: 2.8cqw; color: #fff; padding: 0 .8cqw; border-radius: .6cqw; }
.st.brn { background: #e07038; } .st.par { background: #c8a818; } .st.psn, .st.tox { background: #a050a0; }
.st.slp { background: #8890a0; } .st.frz { background: #58a8d8; }
.msg { left: 1.5%; right: 1.5%; bottom: 2%; height: 25%; background: #fbfbfb; border: .8cqw solid #6878a0;
  border-radius: 1.6cqw; box-shadow: inset 0 0 0 .7cqw #d8e0f0; padding: 2.2cqw 4cqw; font-size: 4.3cqw; line-height: 1.4; color: #383838; }
.msg::after { position: absolute; content: ""; right: 2.4cqw; bottom: 2.4cqw; width: 2.6cqw; height: 2.6cqw; background: #e05050; border-radius: .4cqw; }
.msg.wait::after { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .msg.wait::after { animation: none; } .hpbox .track i { transition: none; } }

/* Bottom screen: the touch menu. */
.touch { background: radial-gradient(circle at 50% 48%, transparent 0 17%, rgba(255, 255, 255, .5) 17.5% 19%, transparent 19.5%),
  radial-gradient(circle at 50% 48%, #e8e8e8 0 40%, #d0d0d8 40.5%), #d0d0d8; }
.balls { left: 2%; right: 2%; top: 1.5%; height: 8%; display: flex; justify-content: space-between; align-items: center; }
.balls > span { position: static; display: flex; gap: 1.2cqw; }
.ball { position: static; width: 4.2cqw; height: 4.2cqw; border-radius: 50%; border: .5cqw solid #383838;
  background: linear-gradient(#e83838 0 45%, #383838 45% 55%, #f8f8f8 55%); }
.ball.out { background: #888; } .ball.none { background: transparent; border-style: dashed; border-color: #999; }
/* The gimmick switch: Mega Evolution / Dynamax for the next move, cycling through what this Pokemon may use. */
.gimmick-flag { position: static; font-size: 3.8cqw; font-weight: 700; padding: .6cqw 2.6cqw; border-radius: 1.6cqw;
  background: linear-gradient(#fbe4c8 0 50%, #f6d0a8 50%); border: .6cqw solid #c06818; color: #7a3a08; }
.gimmick-flag.on { background: linear-gradient(#ff9a40 0 50%, #f07820 50%); border-color: #a04808; color: #fff;
  text-shadow: .4cqw .4cqw 0 rgba(0, 0, 0, .3); box-shadow: 0 0 0 .8cqw rgba(240, 120, 32, .35); }
.gimmick-flag:focus-visible { outline: 1cqw solid var(--cursor); outline-offset: .3cqw; }
.balls.tall { height: 9%; }
.tbtn { border: .7cqw solid; border-radius: 3cqw; color: #fff; font-weight: 700; text-shadow: .5cqw .5cqw 0 rgba(0, 0, 0, .35);
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 1cqw; line-height: 1.2; }
.tbtn > * { position: static; }
.tbtn:active:not(:disabled) { transform: translateY(.6cqw); }
.tbtn:disabled { filter: grayscale(.85) brightness(1.05); opacity: .7; cursor: default; }
.tbtn:focus-visible { outline: 1cqw solid var(--cursor); outline-offset: .4cqw; }
.fight { left: 7%; right: 7%; top: 13%; height: 54%; background: linear-gradient(#e86058 0 50%, #d84038 50%); border-color: #902820;
  box-shadow: inset 0 0 0 1.2cqw rgba(255, 255, 255, .25); font-size: 8cqw; flex-direction: column; gap: 1cqw; }
.fight small { font-size: 3.4cqw; font-weight: 400; opacity: .9; }
.bag { left: 2%; width: 30%; top: 71%; bottom: 2.5%; background: linear-gradient(#f8c840 0 50%, #e8a820 50%); border-color: #987010; font-size: 5.2cqw; }
.run { left: 35%; width: 30%; top: 77%; bottom: 2.5%; background: linear-gradient(#68a8f0 0 50%, #4888e0 50%); border-color: #284898; font-size: 5.2cqw; }
.mons { right: 2%; width: 30%; top: 71%; bottom: 2.5%; background: linear-gradient(#78d070 0 50%, #50b048 50%); border-color: #287020; font-size: 5.2cqw; }
.cancel { left: 2%; right: 2%; top: 81%; bottom: 2.5%; background: linear-gradient(#68a8f0 0 50%, #4888e0 50%); border-color: #284898; font-size: 5.2cqw; }
.move { width: 47%; height: 32%; border-radius: 2.4cqw; color: #283038; text-shadow: none; flex-direction: column; gap: 1.2cqw;
  background: linear-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, .25)), var(--t); border-color: color-mix(in srgb, var(--t) 60%, #000); }
.move .mv { font-size: 5cqw; font-weight: 700; }
.move .meta { display: flex; justify-content: space-between; align-items: center; width: 92%; font-size: 3.4cqw; font-weight: 400; }
.move .meta > * { position: static; }
.move .ty { color: #fff; background: var(--t); border: .4cqw solid color-mix(in srgb, var(--t) 60%, #000); border-radius: .8cqw; padding: 0 1.2cqw; font-size: 3cqw; }
.m0 { left: 2%; top: 11%; } .m1 { right: 2%; top: 11%; } .m2 { left: 2%; top: 46%; } .m3 { right: 2%; top: 46%; }
.slot { width: 47%; height: 21%; border-radius: 2cqw; background: linear-gradient(#a8e090 0 50%, #88cc70 50%); border-color: #3c7a30;
  color: #203018; text-shadow: none; justify-content: flex-start; gap: 1.6cqw; padding: 1cqw 2cqw; }
.slot.active { background: linear-gradient(#90c8f0 0 50%, #70b0e0 50%); border-color: #285890; }
.slot.out { background: linear-gradient(#e8a8a0 0 50%, #d88878 50%); border-color: #883830; }
.slot img { position: static; width: 13cqw; height: 13cqw; image-rendering: pixelated; flex: none; margin: -2cqw -1cqw; }
.slot .info { display: flex; flex-direction: column; align-items: stretch; flex: 1; min-width: 0; font-size: 3.6cqw; text-align: left; }
.slot .info > * { position: static; }
.slot .info .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .track { position: relative; height: 1.8cqw; background: #505858; border-radius: .9cqw; overflow: hidden; margin: .6cqw 0; }
.slot .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hp-green); }
.slot .track i.mid { background: var(--hp-yellow); } .slot .track i.low { background: var(--hp-red); }
.p0 { left: 2%; top: 11%; } .p1 { right: 2%; top: 11%; } .p2 { left: 2%; top: 34%; } .p3 { right: 2%; top: 34%; }
.p4 { left: 2%; top: 57%; } .p5 { right: 2%; top: 57%; }
/* The one in battle cannot be picked but stays bright, as in the game. */
.slot.active:disabled { filter: none; opacity: 1; }
.big { left: 7%; right: 7%; top: 18%; height: 56%; background: linear-gradient(#e86058 0 50%, #d84038 50%); border-color: #902820; font-size: 7cqw; flex-direction: column; }
.big small { font-size: 3.4cqw; font-weight: 400; }

/* ---- Below the DS: the wiki's panels ------------------------------------------------------------------------- */
.card { padding: 10px 12px; background: var(--frame-highlight); border: 2px solid var(--frame-shade); border-radius: 4px; }
.card h2 { margin: 0 0 6px; font-size: 15px; padding-bottom: 4px; border-bottom: 2px solid var(--trim); }
.log { margin: 0; font: 13px/1.6 var(--font); white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
details { padding: 8px 12px; background: var(--panel-alt); border-radius: 4px; }
details > summary { cursor: pointer; font-weight: 700; }
details[open] > summary { margin-bottom: 8px; }
.dim { color: var(--panel-text-dim); font-size: 13px; }
.cand { border-top: 1px solid var(--frame-shade); padding: 5px 0; }
.cand .l1 { display: flex; gap: 8px; align-items: baseline; }
.cand .lbl { flex: 1; min-width: 0; }
.cand.chosen .lbl::after { content: "고름"; margin-left: 6px; font-size: 11px; color: var(--selected-text, #3a2c08); background: var(--selected); border-radius: 3px; padding: 0 5px; }
.cand .detail { font-size: 12px; color: var(--panel-text-dim); overflow-wrap: anywhere; }
.pos { color: #2f7a3e; } .neg { color: var(--danger); } .ex { color: #9a6a00; }
.pm-button { padding: 6px 14px; color: var(--text); background: var(--primary); border: 2px solid var(--border); border-radius: 4px;
  box-shadow: inset 0 -3px 0 var(--primary-pressed); }
.pm-button.warn { background: var(--danger); box-shadow: inset 0 -3px 0 #802820; }
.row-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sets { display: grid; gap: 8px; font-size: 13px; }
.err { color: var(--danger); }
.keys { margin: 0; }
/* The message box while a turn's results play: tap or Z for the next line. */
.msg.more::after { animation: blink 1s steps(2) infinite; }
.scene { cursor: default; }
.scene.playing { cursor: pointer; }
.rec-tag { font-size: 11px; color: var(--text); background: var(--good); border-radius: 3px; padding: 0 6px; margin-left: 6px; letter-spacing: 0; }
.rec-list { display: grid; gap: 6px; }
.rec { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; width: 100%; text-align: left;
  padding: 8px 10px; background: var(--panel); border: 2px solid var(--frame-shade); border-radius: 4px; }
.rec:hover, .rec:focus-visible { border-color: var(--primary); outline: none; }
.rec .when { font-size: 12px; color: var(--panel-text-dim); white-space: nowrap; }
.rec .teams { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec .badge { font-size: 12px; color: #fff; border-radius: 3px; padding: 0 6px; white-space: nowrap; }
.badge.win { background: var(--good); } .badge.lose { background: var(--danger); } .badge.stop { background: var(--panel-text-dim); }
.badge.live { background: var(--cursor); }
.replay h3 { margin: 14px 0 4px; font-size: 14px; padding-bottom: 2px; border-bottom: 2px solid var(--info-band); }
.replay .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.replay .files { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.replay .files a { font-size: 12px; text-decoration: none; }
.entry section { display: grid; gap: 6px; margin-bottom: 12px; }
.entry h3 { margin: 4px 0 0; font-size: 14px; }
.entry select, .entry textarea { width: 100%; font: 13px/1.5 var(--font); color: var(--panel-text); background: var(--panel);
  border: 2px solid var(--border); border-radius: 4px; padding: 6px 8px; }
.entry select:focus, .entry textarea:focus { outline: none; border-color: var(--cursor); }
.pick-row { display: flex; gap: 6px; align-items: stretch; }
.pick-row select { flex: 1; min-width: 0; }
.pick-row .pm-button { flex: none; white-space: nowrap; }
.entry textarea { min-height: 220px; resize: vertical; white-space: pre; overflow-x: auto; }
.side-tag { font-size: 12px; color: #fff; border-radius: 3px; padding: 0 6px; }
.side-tag.me { background: var(--danger); } .side-tag.foe { background: var(--primary); }
@media (hover: none) { .keys { display: none; } }
.tbtn:focus-visible, .tbtn.cursor { outline: 1.2cqw solid var(--cursor); outline-offset: .3cqw; z-index: 2; }
</style>

<div class="shell">
  <div class="titlebar"><strong>빡켓몬 모의 전투</strong><span>BATTLE</span><span class="id" id="info"></span></div>
  <div class="body">
    <div class="ds">
      <div class="screen scene" id="top"></div>
      <div class="screen touch" id="bottom"></div>
    </div>
    <div class="card"><h2>로그</h2><pre class="log" id="results">아직 아무 일도 없습니다.</pre></div>
    <div class="card entry"><h2>엔트리</h2>
      <section><h3><span class="side-tag me">나</span> 내 팀</h3><div class="pick-row"><select id="pick-p1" aria-label="내 팀 불러오기"></select><button class="pm-button" id="reroll-p1" type="button">다시 뽑기</button></div>
        <textarea id="team-p1" spellcheck="false" aria-label="내 팀"></textarea><p class="dim" id="check-p1"></p></section>
      <section><h3><span class="side-tag foe">보스</span> 상대 팀 (보스 AI)</h3><div class="pick-row"><select id="pick-p2" aria-label="상대 팀 불러오기"></select><button class="pm-button" id="reroll-p2" type="button">다시 뽑기</button></div>
        <textarea id="team-p2" spellcheck="false" aria-label="상대 팀"></textarea><p class="dim" id="check-p2"></p></section>
      <p class="dim">트레이너를 고르면 그 팀이 펼쳐지고, 바로 고쳐 쓸 수 있습니다. Showdown 영어 텍스트를 붙여 넣어도 됩니다.</p>
      <div class="row-btns"><button class="pm-button" id="new">이 엔트리로 새 대전</button><span class="dim" id="note"></span></div>
    </div>
    <p class="dim keys">키보드: 방향키 이동 · Z/Enter 고르기 · X/Esc 취소 · 1~4 기술 · D 메가진화·다이맥스 켜기(누를 때마다 바뀜)</p>
    <div id="extra"></div>
    <div class="card records"><h2>지난 판</h2>
      <p class="dim">판마다 PC의 <code>F:/AI/betterai-arena/play/&lt;시각&gt;/battle/</code>에 자동으로 저장됩니다. 누르면 턴별로 다시 봅니다.</p>
      <div id="records"><p class="dim">불러오는 중…</p></div>
    </div>
  </div>
</div>

<script>
const DEX = "__DEX__";
const $ = id => document.getElementById(id);
let N = { species: {}, moves: {}, abilities: {}, items: {} };
let game = null, sending = false, screen = 'main', gimmick = '', shownRequest = -1, flash = '', armed = false;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const id = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const TYPES = { Normal: ['노말', '#a8a878'], Fire: ['불꽃', '#f08030'], Water: ['물', '#6890f0'], Electric: ['전기', '#f8d030'],
  Grass: ['풀', '#78c850'], Ice: ['얼음', '#98d8d8'], Fighting: ['격투', '#c03028'], Poison: ['독', '#a040a0'], Ground: ['땅', '#e0c068'],
  Flying: ['비행', '#a890f0'], Psychic: ['에스퍼', '#f85888'], Bug: ['벌레', '#a8b820'], Rock: ['바위', '#b8a038'], Ghost: ['고스트', '#705898'],
  Dragon: ['드래곤', '#7038f8'], Dark: ['악', '#705848'], Steel: ['강철', '#b8b8d0'], Fairy: ['페어리', '#ee99ac'], Stellar: ['스텔라', '#88a0d0'] };
const STAT = { atk: '공격', def: '방어', spa: '특공', spd: '특방', spe: '스피드', accuracy: '명중', evasion: '회피',
  attack: '공격', defence: '방어', defense: '방어', special_attack: '특공', special_defence: '특방', special_defense: '특방', speed: '스피드' };
const STATUS = { brn: '화상', par: '마비', psn: '독', tox: '맹독', slp: '잠듦', frz: '얼음' };
const WEATHER = { SunnyDay: '쾌청', RainDance: '비', Sandstorm: '모래바람', Hail: '싸라기눈', Snow: '설경', none: '없음' };
const MECH = { dynamax: '다이맥스', terastallize: '테라스탈', terastal: '테라스탈', mega: '메가진화', zmove: 'Z기술', ultra: '울트라버스트' };

const FORMS = { galar: '가라르', alola: '알로라', hisui: '히스이', paldea: '팔데아', mega: '메가', megax: '메가X', megay: '메가Y',
  gmax: '거다이맥스', f: '♀', m: '♂', therian: '영물폼', origin: '오리진폼', midnight: '한밤중의 모습', dusk: '황혼의 모습' };
function mon(name) {
  const key = id(name);
  if (N.species[key]) return N.species[key];
  for (let end = key.length - 1; end > 3; end--) {
    if (N.species[key.slice(0, end)]) {
      const form = String(name).includes('-') ? String(name).split('-').slice(1).join('-') : key.slice(end);
      return `${N.species[key.slice(0, end)]}-${FORMS[id(form)] || form}`;
    }
  }
  return String(name ?? '?');
}
const move = s => N.moves[id(s)] || String(s ?? '');
const ability = s => N.abilities[id(s)] || String(s ?? '');
const item = s => N.items[id(s)] || DEX.itemNames?.[id(s)] || String(s ?? '');
/** 은/는, 이/가 by the last syllable's final consonant. */
function josa(word, withFinal, without) {
  const c = String(word).charCodeAt(String(word).length - 1);
  return word + (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? withFinal : without);
}

/* Sprites from Pokemon Showdown: Diamond/Pearl's own (gen4) where they exist, else the gen5 style that covers every species. */
function spriteId(name) {
  const key = id(name);
  if (DEX.sprites && DEX.sprites[key]) return DEX.sprites[key];
  const [base, ...form] = String(name).split('-');
  return id(base) + (form.length ? '-' + id(form.join('')) : '');
}
/** Which URL each sprite loaded from, so a redraw does not walk the gen4 -> gen5 fallback again (and blink). */
const spriteFound = {};
function spriteTag(name, back, cls) {
  const sid = spriteId(name);
  const dir = back ? '-back' : '';
  const key = sid + dir;
  const chain = spriteFound[key] ? [spriteFound[key]] : [`gen4${dir}`, `gen5${dir}`].map(d => `https://play.pokemonshowdown.com/sprites/${d}/${sid}.png`);
  return `<img class="${cls}" alt="" src="${chain[0]}" data-key="${key}" data-next="${chain[1] || ''}"
    onload="spriteFound[this.dataset.key]=this.src"
    onerror="if(this.dataset.next){this.src=this.dataset.next;this.dataset.next=''}else{this.classList.add('gone')}">`;
}

function who(text) {
  const m = /^(p\d)[a-z]?: (.+)$/.exec(text || '');
  return m ? (m[1] === 'p1' ? '' : '상대 ') + mon(m[2]) : text;
}
function hp(text) {
  const m = /^(\d+)(?:\/(\d+))?/.exec(text || '');
  if (!m) return text;
  return !m[2] || m[2] === '100' ? `${m[1]}%` : `${m[1]}/${m[2]}`;
}
function source(text) {
  text = (text || '').trim();
  for (const [p, f] of [['move: ', move], ['item: ', item], ['ability: ', ability]]) if (text.startsWith(p)) return f(text.slice(p.length));
  if (/^p\d[a-z]?: /.test(text)) return who(text);
  return WEATHER[text] || (N.moves[id(text)] ? move(text) : text);
}
/** One public log line as the game's message, or null. */
function line(raw) {
  const all = raw.split('|').slice(1);
  if (!all.length) return null;
  const kind = all[0];
  const tags = all.slice(1).filter(a => a.startsWith('['));
  const args = all.slice(1).filter(a => !a.startsWith('['));
  const from = tags.find(t => t.startsWith('[from]'));
  const src = from ? ` (${source(from.slice(6))})` : '';
  const a = i => args[i] ?? '';
  if (tags.includes('[silent]') || ['player', 'teamsize', 'gen', 'tier', 'gametype', 'start', 'rule', '', 'upkeep',
    'teampreview', 'poke', 'clearpoke', 'j', 'l'].includes(kind)) return null;
  switch (kind) {
    case 'turn': return `── ${a(0)}턴 ──`;
    case 'move': return `${who(a(0))}의 ${move(a(1))}!`;
    case 'switch': case 'drag': return a(0).startsWith('p1') ? `가랏! ${mon(a(1).split(',')[0])}!` : `상대는 ${josa(mon(a(1).split(',')[0]), '을', '를')} 내보냈다!`;
    case '-damage': return `  ${who(a(0))} HP ${hp(a(1))}${src}`;
    case '-heal': return `  ${who(a(0))}의 HP가 회복됐다 (${hp(a(1))})${src}`;
    case 'faint': return `${josa(who(a(0)), '은', '는')} 쓰러졌다!`;
    case '-boost': return `  ${who(a(0))}의 ${josa(STAT[a(1)] || a(1), '이', '가')}${Number(a(2)) > 1 ? ' 크게' : ''} 올라갔다!${src}`;
    case '-unboost': return `  ${who(a(0))}의 ${josa(STAT[a(1)] || a(1), '이', '가')}${Number(a(2)) > 1 ? ' 크게' : ''} 떨어졌다!${src}`;
    case '-status': return `  ${josa(who(a(0)), '은', '는')} ${STATUS[a(1)] || a(1)} 상태가 됐다!${src}`;
    case '-curestatus': return `  ${who(a(0))}의 ${josa(STATUS[a(1)] || a(1), '이', '가')} 나았다!`;
    case '-weather': return tags.includes('[upkeep]') ? null : (a(0) === 'none' ? '날씨가 원래대로 돌아왔다' : `날씨: ${WEATHER[a(0)] || a(0)}${src}`);
    case '-crit': return '  급소에 맞았다!';
    case '-supereffective': return '  효과가 굉장했다!';
    case '-extremelyeffective': return '  효과가 굉장했다! (4배)';
    case '-resisted': return '  효과가 별로인 듯하다…';
    case '-immune': return `  ${who(a(0))}에게는 효과가 없는 것 같다…${src}`;
    case '-miss': return `  ${who(a(1) || a(0))}에게는 맞지 않았다!`;
    case '-fail': return '  그러나 실패했다!';
    case 'cant': return `  ${josa(who(a(0)), '은', '는')} 움직일 수 없다! (${a(1)})`;
    case '-enditem': return id(a(1)) === 'focussash' ? `${josa(who(a(0)), '은', '는')} 기합의띠로 버텼다!` : `  ${who(a(0))}의 ${item(a(1))}${src}`;
    case '-item': return `  ${who(a(0))}의 ${item(a(1))}${src}`;
    case '-ability': return `  ${who(a(0))}의 ${ability(a(1))}!`;
    case '-start': return a(1) === 'Dynamax' ? `${josa(who(a(0)), '은', '는')} ${a(2) === 'Gmax' ? '거다이맥스' : '다이맥스'}했다!` : `  ${josa(who(a(0)), '은', '는')} ${source(a(1))}`;
    case '-end': return a(1) === 'Dynamax' ? `  ${who(a(0))}의 다이맥스가 끝났다` : `  ${who(a(0))}의 ${source(a(1))} 끝`;
    // A Mega or Primal form arriving is the gimmick; the form going back (a fainted Mega) says nothing.
    case 'detailschange': return /-(Mega|Primal)/.test(a(1)) ? `${josa(who(a(0)), '은', '는')} ${josa(mon(a(1).split(',')[0]), '으로', '로')} ${/-Mega/.test(a(1)) ? '메가진화했다!' : '원시회귀했다!'}` : null;
    case '-sidestart': return `${a(0).startsWith('p1') ? '내' : '상대'} 진영에 ${source(a(1))}`;
    case '-sideend': return `${a(0).startsWith('p1') ? '내' : '상대'} 진영의 ${source(a(1))} 사라졌다`;
    case '-fieldstart': return `${source(a(0))} 시작`;
    case '-fieldend': return `${source(a(0))} 끝`;
    case 'win': return a(0) === 'p1' ? '보스와의 승부에서 이겼다!' : '눈앞이 캄캄해졌다!';
    default: return '  ' + [kind.replace(/^-/, ''), ...args.map(x => /^p\d[a-z]?: /.test(x) ? who(x) : x)].join(' ');
  }
}
const pretty = log => (log || []).map(line).filter(Boolean);
function lastTurns(log, turns) {
  let seen = 0, start = 0;
  for (let i = log.length - 1; i >= 0; i--) if (log[i].startsWith('|turn|') && ++seen === turns) { start = i; break; }
  return log.slice(start);
}
const pct = f => Math.max(0, Math.min(100, Math.round(f * 100)));
const tone = p => p <= 20 ? 'low' : p <= 50 ? 'mid' : '';

/** What the page knows of both sides: names, levels, genders, HP, status from the request and the log. */
function sides(p, teams) {
  const latest = {};
  for (const raw of p?.log || []) {
    const m = /^\|(?:switch|drag|replace|detailschange)\|(p\d)[a-z]?: ([^|]+)\|([^|]+)/.exec(raw);
    if (m) latest[m[1]] = m[3];
  }
  const details = d => {
    const parts = String(d || '').split(',').map(s => s.trim());
    return { name: parts[0], level: (parts.find(x => /^L\d+$/.test(x)) || 'L100').slice(1), gender: parts.find(x => x === 'M' || x === 'F') || '' };
  };
  const mine = (p?.side?.pokemon || []).map(s => {
    const cond = s.condition || '';
    const [now, rest] = cond.split('/');
    const max = parseInt(rest), cur = parseInt(now);
    return { ...details(s.details), active: s.active, fainted: cond.includes('fnt'), cur: cur || 0, max: max || 0,
      frac: max ? cur / max : 0, status: (cond.split(' ')[1] || '').replace('fnt', ''), item: s.item, ability: s.ability || s.baseAbility, moves: s.moves };
  });
  const board = (p?.board || []).filter(b => !b.mine);
  const foeActive = board.find(b => b.active && !b.fainted);
  const foeInfo = latest.p2 ? details(latest.p2) : null;
  const foeTeam = (teams?.p2 || []).map(s => {
    const b = board.find(x => id(x.species) === id(s.species) || id(s.species).startsWith(id(x.species)));
    return { name: s.species, seen: !!b, fainted: b?.fainted };
  });
  return { mine, me: mine.find(m => m.active && !m.fainted), foe: foeActive && { ...foeActive, ...(foeInfo || { name: foeActive.species, level: '50', gender: '' }) }, foeTeam };
}

function hpBox(side, who, cls) {
  if (!who) return '';
  const p = side === 'me' ? pct(who.frac) : pct(who.hp);
  const st = side === 'me' ? who.status : String(who.status || '').split(':').pop();
  const stages = side === 'foe' ? Object.entries(who.stages || {}).map(([k, v]) => `${STAT[k] || k} ${v > 0 ? '+' : ''}${v}`).join(' ') : '';
  const meStages = side === 'me' ? (game?.pending?.board || []).find(b => b.mine && b.active)?.stages : null;
  const stageText = stages || Object.entries(meStages || {}).map(([k, v]) => `${STAT[k] || k} ${v > 0 ? '+' : ''}${v}`).join(' ');
  return `<div class="hpbox ${cls}">
    <div class="row"><span class="nm">${esc(mon(who.name))}</span>${who.gender === 'M' ? '<span class="male">♂</span>' : who.gender === 'F' ? '<span class="female">♀</span>' : ''}
      ${st && STATUS[st] ? `<span class="st ${st}">${STATUS[st]}</span>` : ''}<span class="lv">Lv${esc(who.level)}</span></div>
    <div class="bar"><b>HP</b><span class="track"><i class="${tone(p)}" style="width:${p}%"></i></span></div>
    ${side === 'me' ? `<span class="nums">${who.cur}/ ${who.max}</span>` : ''}
    ${stageText ? `<span class="stg">${esc(stageText)}</span>` : ''}
  </div>`;
}

/*
 * A turn's results, played line by line in the message box as the games do: the scene changes with each line
 * (switch-ins, HP, faints), a damage line without a source only moves the HP bar.
 */
let playback = null, seen = { id: null, len: 0 }, justStarted = false;
const hpOf = text => { const x = /^(\d+)(?:\/(\d+))?/.exec(text || ''); return x ? Number(x[1]) / Number(x[2] || 100) : null; };
/** The scene as the previous request left it, before this turn's results play. */
function sceneFrom(p) {
  const s = p ? sides(p, game?.teams) : { mine: [] };
  return {
    mine: s.mine || [],
    foe: s.foe ? { name: s.foe.name, level: s.foe.level, gender: s.foe.gender, hp: s.foe.hp, status: String(s.foe.status || '').split(':').pop(), stages: { ...(s.foe.stages || {}) } } : null,
    me: s.me ? { name: s.me.name, level: s.me.level, gender: s.me.gender, hp: s.me.frac, status: s.me.status, stages: {} } : null,
  };
}
function applyEvent(raw, scene) {
  const parts = raw.split('|').slice(1), kind = parts[0];
  const m = /^(p\d)[a-z]?: (.+)$/.exec(parts[1] || '');
  if (!m) return;
  const side = m[1] === 'p1' ? 'me' : 'foe';
  if (['switch', 'drag', 'replace'].includes(kind)) {
    const d = String(parts[2] || '').split(',').map(x => x.trim());
    scene[side] = { name: d[0], level: (d.find(x => /^L\d+$/.test(x)) || 'L100').slice(1), gender: d.find(x => x === 'M' || x === 'F') || '',
      hp: hpOf(parts[3]) ?? 1, status: String(parts[3] || '').split(' ')[1] || '', stages: {} };
    return;
  }
  const v = scene[side];
  if (!v) return;
  if (kind === '-damage' || kind === '-heal') { const f = hpOf(parts[2]); if (f != null) v.hp = /fnt/.test(parts[2]) ? 0 : f; }
  else if (kind === 'faint') scene[side] = null;
  else if (kind === '-status') v.status = parts[2];
  else if (kind === '-curestatus') v.status = '';
  else if (kind === 'detailschange') v.name = String(parts[2] || '').split(',')[0];
  else if (kind === '-boost' || kind === '-unboost') v.stages[parts[2]] = (v.stages[parts[2]] || 0) + (kind === '-boost' ? 1 : -1) * Number(parts[3] || 1);
}
/** Lines that print, each carrying the silent events (a plain damage or heal) that follow it. */
function buildSteps(raws) {
  const steps = [];
  for (const raw of raws) {
    const kind = raw.split('|')[1];
    const silent = (kind === '-damage' || kind === '-heal') && !raw.includes('[from]');
    const text = silent || kind === 'turn' ? null : line(raw);
    if (text) steps.push({ text: text.trim(), events: [raw] });
    else if (steps.length) steps[steps.length - 1].events.push(raw);
    else steps.push({ text: null, events: [raw] });
  }
  return steps;
}
function startPlayback(raws, scene) {
  const steps = buildSteps(raws);
  if (!steps.some(st => st.text)) { return; }
  clearTimeout(playback?.timer);
  playback = { steps, index: -1, scene };
  nextStep();
}
function nextStep() {
  if (!playback) return;
  clearTimeout(playback.timer);
  playback.index++;
  const step = playback.steps[playback.index];
  if (!step) { playback = null; render(); return; }
  step.events.forEach(raw => applyEvent(raw, playback.scene));
  if (!step.text) { nextStep(); return; }
  render();
  playback.timer = setTimeout(nextStep, 1300);
}
function skipPlayback() {
  while (playback) {
    clearTimeout(playback.timer);
    playback.index++;
    const step = playback.steps[playback.index];
    if (!step) { playback = null; break; }
    step.events.forEach(raw => applyEvent(raw, playback.scene));
  }
  render();
}
/** Called with the new state before it is drawn: plays what happened since the last request this page showed. */
function onUpdate() {
  if (!game) return;
  const log = game.status === 'done' ? game.result?.log : game.pending?.log;
  if (!log) return;
  if (seen.id !== game.id) {
    seen = { id: game.id, len: justStarted ? 0 : log.length };
    justStarted = false;
  }
  if (log.length <= seen.len) return;
  const base = window.__last && window.__lastGame === game.id ? window.__last : null;
  startPlayback(log.slice(seen.len), sceneFrom(base));
  seen.len = log.length;
}

function message() {
  if (playback) return esc(playback.steps[playback.index]?.text || '');
  if (flash) return flash;
  if (!game) return '보스 AI와 3대3 싱글 승부!<br>아래 버튼으로 시작하세요.';
  const p = game.pending || window.__last;
  const s = sides(p, game.teams);
  switch (game.status) {
    case 'starting': return '보스가 승부를 걸어왔다!<br>팀을 고르는 중…';
    case 'ai_thinking': return sending ? '…' : '보스는 무엇을 할지<br>생각하고 있다…';
    case 'your_turn':
      if (game.pending?.forced) return '다음 포켓몬을<br>골라 주세요.';
      return s.me ? `${josa(mon(s.me.name), '은', '는')}<br>무엇을 할까?` : '무엇을 할까?';
    case 'done': return game.result?.winner === 'p1' ? '보스와의 승부에서<br>이겼다!' : game.result?.winner ? '눈앞이 캄캄해졌다!' : '승부가 나지 않았다…';
    case 'error': return '대전이 오류로 멈췄다.';
    default: return '승부가 중단됐다.';
  }
}

function renderTop() {
  const p = game?.pending || window.__last;
  let s = p ? sides(p, game?.teams) : {};
  if (playback) {
    // The scene as the results so far leave it; my HP shown against the real maximum.
    const sc = playback.scene;
    const real = name => sc.mine.find(m => id(m.name) === id(name) || id(m.name).startsWith(id(name)) || id(name).startsWith(id(m.name)));
    const meMax = sc.me ? (real(sc.me.name)?.max || 100) : 0;
    s = { ...s, foe: sc.foe, me: sc.me && { ...sc.me, frac: sc.me.hp, max: meMax, cur: Math.round(sc.me.hp * meMax) } };
  }
  const wait = !playback && game && ['starting', 'ai_thinking'].includes(game.status);
  $('top').classList.toggle('playing', !!playback);
  $('top').innerHTML = `<span class="stripe"></span><span class="platform foe"></span><span class="platform me"></span>
    ${s.foe ? spriteTag(s.foe.name, false, 'sprite foe') : ''}
    ${s.me ? spriteTag(s.me.name, true, 'sprite me') : ''}
    ${hpBox('foe', s.foe, 'foe')}${hpBox('me', s.me, 'me')}
    <div class="msg ${wait ? 'wait' : ''} ${playback ? 'more' : ''}">${message()}</div>`;
}

function balls(list) {
  const out = list.map(m => `<span class="ball ${m.fainted ? 'out' : ''}"></span>`);
  while (out.length < 6) out.push('<span class="ball none"></span>');
  return out.slice(0, 6).join('');
}

function moveButtons(p) {
  const options = p.options.filter(o => o.parts[0]?.kind === 'USE_MOVE');
  const plain = options.filter(o => !o.parts[0].mechanic);
  const mechOf = o => id(String(o.parts[0].mechanic || '').split(':').pop());
  const mechs = [...new Set(options.map(mechOf).filter(Boolean))];
  if (gimmick && !mechs.includes(gimmick)) gimmick = '';
  const gimmicks = options.filter(o => gimmick && mechOf(o) === gimmick);
  window.__mechs = mechs;
  const slots = (p.active?.[0]?.moves || []);
  const shown = slots.map((slot, i) => {
    const option = gimmick ? gimmicks.find(o => o.id.startsWith(`move ${i + 1} `)) : plain.find(o => o.id === `move ${i + 1}`);
    const moveId = option ? String(option.parts[0].move || slot.id).split(':').pop() : slot.id;
    const info = DEX.moves?.[id(moveId)] || DEX.moves?.[id(slot.id)] || ['Normal', 'Status'];
    const [tname, tcolor] = TYPES[info[0]] || ['???', '#a8a878'];
    return `<button class="tbtn move m${i}" style="--t:${tcolor}" ${option ? `data-action="${esc(option.id)}"` : 'disabled'}>
      <span class="mv">${esc(move(moveId))}</span>
      <span class="meta"><span class="ty">${tname}</span><span>PP ${slot.pp}/${slot.maxpp}</span></span></button>`;
  }).join('');
  const label = gimmick ? `${MECH[gimmick] || gimmick} 켬 ✓` : `${mechs.map(m => MECH[m] || m).join(' / ')} 하기`;
  return `<div class="balls tall"><span>${mechs.length ? `<button class="gimmick-flag ${gimmick ? 'on' : ''}" id="gimmick" aria-pressed="${!!gimmick}">${esc(label)}</button>` : ''}</span><span></span></div>
    ${shown}<button class="tbtn cancel" data-go="main">취소</button>`;
}

/** Off -> each gimmick this Pokemon may use -> off. */
function cycleGimmick() {
  const order = ['', ...(window.__mechs || [])];
  gimmick = order[(order.indexOf(gimmick) + 1) % order.length];
}

function partyButtons(p, s, forced) {
  const switches = p.options.filter(o => o.parts[0]?.kind === 'SWITCH');
  const slots = s.mine.map((m, i) => {
    const option = switches.find(o => id(o.parts[0].switchTo) && (id(m.name).startsWith(id(o.parts[0].switchTo)) || id(o.parts[0].switchTo).startsWith(id(m.name))));
    const pp = pct(m.frac);
    return `<button class="tbtn slot p${i} ${m.active ? 'active' : ''} ${m.fainted ? 'out' : ''}" ${option ? `data-action="${esc(option.id)}"` : 'disabled'}>
      ${spriteTag(m.name, false, '')}
      <span class="info"><span class="nm">${esc(mon(m.name))} <small>Lv${esc(m.level)}</small></span>
        <span class="track"><i class="${tone(pp)}" style="width:${pp}%"></i></span>
        <span>${m.fainted ? '기절' : `${m.cur}/${m.max}${m.status && STATUS[m.status] ? ' ' + STATUS[m.status] : ''}`}</span></span></button>`;
  }).join('');
  return `<div class="balls"><span></span><span></span></div>${slots}${forced ? '' : '<button class="tbtn cancel" data-go="main">취소</button>'}`;
}

function renderBottom() {

/* ---- Entries: each side's team as Showdown-style text (Korean names), from a preset or typed ---------------- */
const PRESETS = "__PRESETS__";
const NATURES = { hardy: '노력', lonely: '외로움', brave: '용감', adamant: '고집', naughty: '개구쟁이', bold: '대담', docile: '온순',
  relaxed: '무사태평', impish: '장난꾸러기', lax: '촐랑', timid: '겁쟁이', hasty: '성급', serious: '성실', jolly: '명랑', naive: '천진난만',
  modest: '조심', mild: '의젓', quiet: '냉정', bashful: '수줍음', rash: '덜렁', calm: '차분', gentle: '얌전', sassy: '건방', careful: '신중', quirky: '변덕' };
const STAT_KO = { hp: 'HP', atk: '공격', def: '방어', spa: '특공', spd: '특방', spe: '스피드' };
const STAT_IDS = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];
const STAT_READ = { hp: 'hp', atk: 'atk', def: 'def', spa: 'spa', spd: 'spd', spe: 'spe', 공격: 'atk', 방어: 'def', 특공: 'spa',
  특방: 'spd', 스피드: 'spe', 특수공격: 'spa', 특수방어: 'spd' };
let reverse = null;
/** Korean name -> id for species, moves, abilities, items, natures and forms (built once the names arrive). */
function reverseNames() {
  if (reverse) return reverse;
  const flip = obj => Object.fromEntries(Object.entries(obj || {}).map(([k, v]) => [String(v).replace(/\s/g, ''), k]));
  reverse = { species: flip(N.species), moves: flip(N.moves), abilities: flip(N.abilities), items: flip({ ...DEX.itemNames, ...N.items }),
    natures: flip(NATURES), forms: flip(FORMS) };
  return reverse;
}
const look = (kind, text) => { const t = String(text || '').trim(); return reverseNames()[kind][t.replace(/\s/g, '')] || id(t); };
function speciesId(text) {
  const t = String(text || '').trim();
  const whole = look('species', t);
  if (DEX.sprites?.[id(whole)]) return whole;
  const cut = t.indexOf('-');
  if (cut < 0) return whole;
  const base = look('species', t.slice(0, cut));
  const form = reverseNames().forms[t.slice(cut + 1).replace(/\s/g, '')] || id(t.slice(cut + 1));
  return `${base}-${form}`;
}

function exportText(sets) {
  return sets.map(s => {
    const out = [`${mon(s.species)}${s.gender === 'M' ? ' (M)' : s.gender === 'F' ? ' (F)' : ''}${s.item ? ' @ ' + item(s.item) : ''}`];
    if (s.ability) out.push(`특성: ${ability(s.ability)}`);
    out.push(`레벨: ${s.level || 50}`);
    out.push(`성격: ${NATURES[id(s.nature)] || s.nature}`);
    const evs = STAT_IDS.filter(k => s.evs?.[k]).map(k => `${s.evs[k]} ${STAT_KO[k]}`);
    if (evs.length) out.push(`노력치: ${evs.join(' / ')}`);
    const ivs = STAT_IDS.filter(k => s.ivs?.[k] != null && s.ivs[k] !== 31).map(k => `${s.ivs[k]} ${STAT_KO[k]}`);
    if (ivs.length) out.push(`개체값: ${ivs.join(' / ')}`);
    if (s.gigantamax) out.push('거다이맥스: 예');
    if (s.dynamaxPriority != null) out.push(`다이맥스 우선: ${s.dynamaxPriority}`);
    if (s.canDynamax === 'none') out.push('다이맥스: 안 함');
    (s.moves || []).forEach(m => out.push(`- ${move(m)}`));
    return out.join('\n');
  }).join('\n\n');
}

/** Showdown-style text (Korean or English names) -> sets as the bridge reads them, with any problems. */
function parseText(text) {
  const sets = [], errors = [];
  const blocks = String(text || '').replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  blocks.forEach((block, n) => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    const set = { level: 50, gender: '', ability: '', item: '', nature: 'serious', moves: [], evs: {}, ivs: {} };
    let head = lines.shift();
    const at = head.lastIndexOf('@');
    if (at >= 0) { set.item = look('items', head.slice(at + 1)); head = head.slice(0, at).trim(); }
    const g = /\((M|F)\)\s*$/.exec(head);
    if (g) { set.gender = g[1]; head = head.slice(0, g.index).trim(); }
    const nick = /\(([^()]+)\)\s*$/.exec(head);
    if (nick) head = nick[1];
    set.species = speciesId(head);
    const who = `${n + 1}번째(${head})`;
    const spread = (text, into) => text.split('/').forEach(part => {
      const m = /^\s*(\d+)\s*(.+?)\s*$/.exec(part);
      const stat = m && (STAT_READ[m[2].toLowerCase()] || STAT_READ[m[2]]);
      if (stat) into[stat] = Number(m[1]); else if (part.trim()) errors.push(`${who}: '${part.trim()}'를 읽지 못했습니다`);
    });
    for (const line of lines) {
      let m;
      if ((m = /^[-–]\s*(.+)$/.exec(line))) set.moves.push(look('moves', m[1].replace(/\[.*?\]/g, '')));
      else if ((m = /^(?:특성|Ability)\s*:\s*(.+)$/i.exec(line))) set.ability = look('abilities', m[1]);
      else if ((m = /^(?:레벨|Level)\s*:\s*(\d+)/i.exec(line))) set.level = Number(m[1]);
      else if ((m = /^성격\s*:\s*(.+)$/.exec(line)) || (m = /^(\S+)\s+Nature$/i.exec(line))) set.nature = look('natures', m[1]);
      else if ((m = /^(?:노력치|EVs)\s*:\s*(.+)$/i.exec(line))) spread(m[1], set.evs);
      else if ((m = /^(?:개체값|IVs)\s*:\s*(.+)$/i.exec(line))) spread(m[1], set.ivs);
      else if ((m = /^(?:거다이맥스|Gigantamax)\s*:\s*(.+)$/i.exec(line))) set.gigantamax = /^(예|yes|true)$/i.test(m[1].trim());
      else if ((m = /^(?:다이맥스 우선|Dynamax Priority)\s*:\s*(\d+)/i.exec(line))) set.dynamaxPriority = Number(m[1]);
      else if ((m = /^(?:다이맥스|Dynamax)\s*:\s*(.+)$/i.exec(line))) { if (/안|no|none|false/i.test(m[1])) set.canDynamax = 'none'; }
      else if (/^(?:Tera Type|Shiny|Happiness|Dynamax Level|테라스탈|이로치)/i.test(line)) { /* not used by the battle */ }
      else errors.push(`${who}: '${line}'를 읽지 못했습니다`);
    }
    if (!DEX.sprites?.[id(set.species)]) errors.push(`${who}: 종족을 모르겠습니다`);
    if (!set.moves.length || set.moves.length > 4) errors.push(`${who}: 기술은 1~4개여야 합니다`);
    set.moves.forEach(m => { if (!DEX.moves?.[id(m)]) errors.push(`${who}: 기술 '${m}'을 모르겠습니다`); });
    if (set.level < 1 || set.level > 200) errors.push(`${who}: 레벨이 이상합니다`);
    const evTotal = STAT_IDS.reduce((a, k) => a + (set.evs[k] || 0), 0);
    if (evTotal > 510) errors.push(`${who}: 노력치 합이 ${evTotal}로 510을 넘습니다`);
    set.evs = Object.fromEntries(STAT_IDS.map(k => [k, set.evs[k] ?? 0]));
    set.ivs = Object.fromEntries(STAT_IDS.map(k => [k, set.ivs[k] ?? 31]));
    sets.push(set);
  });
  if (!sets.length) errors.push('포켓몬이 없습니다');
  if (sets.length > 6) errors.push(`최대 6마리입니다 (${sets.length}마리)`);
  return { sets, errors };
}

function randomRentals(count) {
  const pool = [...(PRESETS.rentals || [])], picked = [], seen = new Set();
  while (picked.length < count && pool.length) {
    const s = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    if (!seen.has(s.species)) { seen.add(s.species); picked.push(s); }
  }
  return picked;
}
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* per-device convenience only */ } } };

function fillPicker(side) {
  const pick = $(`pick-${side}`);
  pick.innerHTML = `<option value="random">무작위 3마리 (렌탈 세트)</option><option value="custom">직접 입력</option>` +
    (PRESETS.leagues || []).map((r, ri) => `<optgroup label="${esc(r.region)}">${r.trainers.map((t, ti) =>
      `<option value="${ri}:${ti}">${esc(r.region)} · ${esc(t.label)}</option>`).join('')}</optgroup>`).join('');
}
function loadPreset(side, value) {
  if (value === 'custom') return;
  let sets;
  if (value === 'random') sets = randomRentals(3);
  else { const [ri, ti] = value.split(':').map(Number); sets = PRESETS.leagues[ri].trainers[ti].sets; }
  $(`team-${side}`).value = exportText(sets);
  checkEntry(side);
}
function reroll(side) {
  const value = $(`pick-${side}`).value;
  const league = /^(\d+):(\d+)$/.exec(value);
  if (league) {
    const trainers = PRESETS.leagues[Number(league[1])].trainers;
    const others = trainers.map((_, i) => i).filter(i => i !== Number(league[2]));
    const next = `${league[1]}:${others[Math.floor(Math.random() * others.length)]}`;
    $(`pick-${side}`).value = next;
    loadPreset(side, next);
  } else {
    $(`pick-${side}`).value = 'random';
    loadPreset(side, 'random');
  }
}

/** Both sides' entry text and picker, kept on the PC so a new tunnel address (a new page origin) still has them. */
let saveTimer = null;
function saveEntries() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = Object.fromEntries(['p1', 'p2'].map(side => [side, { text: $(`team-${side}`).value, pick: $(`pick-${side}`).value }]));
    fetch('api/entry', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  }, 600);
}

function checkEntry(side) {
  const { sets, errors } = parseText($(`team-${side}`).value);
  const out = $(`check-${side}`);
  if (errors.length) {
    out.className = 'err';
    out.textContent = errors.slice(0, 4).join(' · ') + (errors.length > 4 ? ` 외 ${errors.length - 4}개` : '');
  } else {
    const dmax = sets.some(s => s.canDynamax !== 'none');
    out.className = 'dim';
    out.textContent = `${sets.length}마리 · 다이맥스 ${dmax ? '가능' : '안 함'}${sets.some(s => s.gigantamax) ? ' (거다이맥스 있음)' : ''} · 메가진화는 메가스톤을 든 포켓몬만`;
  }
  store.set(`entry-${side}`, $(`team-${side}`).value);
  store.set(`pick-${side}`, $(`pick-${side}`).value);
  if (entriesReady) saveEntries();
  return { sets, errors };
}
let entriesReady = false;
/** The PC's saved entry first, then this browser's, else a fresh random draw. */
async function setupEntries() {
  let server = {};
  try { server = await (await fetch('api/entry', { cache: 'no-store' })).json(); } catch (e) { /* this browser's copy then */ }
  if (!server.p1 || !server.p2) {
    // Nothing saved on the PC yet: the last finished battle's two teams, so a reconnect shows that matchup.
    try {
      const last = ((await (await fetch('api/records', { cache: 'no-store' })).json()).records || []).find(r => r.status === 'done');
      const r = last && await (await fetch(`api/record?id=${encodeURIComponent(last.id)}`, { cache: 'no-store' })).json();
      if (r?.teams) server = Object.fromEntries(['p1', 'p2'].map(side => [side, { text: exportText(r.teams[side].map(t => ({
        ...t, item: id(t.item), ability: id(t.ability), moves: (t.moves || []).map(id) }))), pick: 'custom' }]));
    } catch (e) { /* this browser's copy then */ }
  }
  for (const side of ['p1', 'p2']) {
    fillPicker(side);
    const text = server[side]?.text ?? store.get(`entry-${side}`);
    const pick = server[side]?.pick ?? store.get(`pick-${side}`) ?? 'random';
    $(`pick-${side}`).value = [...$(`pick-${side}`).options].some(o => o.value === pick) ? pick : 'custom';
    if (text) { $(`team-${side}`).value = text; checkEntry(side); } else loadPreset(side, $(`pick-${side}`).value);
    $(`pick-${side}`).addEventListener('change', e => loadPreset(side, e.target.value));
    $(`team-${side}`).addEventListener('input', () => { $(`pick-${side}`).value = 'custom'; checkEntry(side); });
    $(`reroll-${side}`).addEventListener('click', () => reroll(side));
  }
  entriesReady = true;
  if (!server.p1 || !server.p2) saveEntries();
}

/* ---- Keyboard: a DS cursor over the bottom screen's buttons ---------------------------------------------- */
let keyboard = false, cursorKey = null;
const keyOf = b => b.dataset.action || b.dataset.go || b.dataset.say || b.id || b.className;
const touchButtons = () => [...$('bottom').querySelectorAll('button:not(:disabled)')];
function focusButton(b) {
  if (!b) return;
  cursorKey = keyOf(b);
  b.focus({ preventScroll: true });
}
function restoreCursor() {
  if (!keyboard) return;
  const buttons = touchButtons();
  focusButton(buttons.find(b => keyOf(b) === cursorKey) || buttons[0]);
}
/** The nearest button from `from` in a direction, by the buttons' centres on screen. */
function nearest(from, dx, dy) {
  const box = b => { const r = b.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  const a = box(from);
  let best = null, bestScore = Infinity;
  for (const b of touchButtons()) {
    if (b === from) continue;
    const c = box(b);
    const along = (c.x - a.x) * dx + (c.y - a.y) * dy;
    const across = Math.abs((c.x - a.x) * dy) + Math.abs((c.y - a.y) * dx);
    // Only what lies in that direction's cone: a button a little lower beside this one is not "below" it.
    if (along <= 1 || across > along * 2) continue;
    const score = along + across * 2;
    if (score < bestScore) { bestScore = score; best = b; }
  }
  return best;
}
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.matches?.('input, textarea, select')) return;
  if (playback) {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'z' || k === 'Enter' || k === ' ') { e.preventDefault(); nextStep(); return; }
    if (k === 'x' || k === 'Escape') { e.preventDefault(); skipPlayback(); return; }
  }
  const buttons = touchButtons();
  const current = buttons.includes(document.activeElement) ? document.activeElement : null;
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (dirs[key]) {
    e.preventDefault();
    keyboard = true;
    focusButton(current ? (nearest(current, ...dirs[key]) || current) : buttons[0]);
  } else if (key === 'z' || ((key === 'Enter' || key === ' ') && !current)) {
    e.preventDefault();
    keyboard = true;
    if (current) current.click(); else focusButton(buttons[0]);
  } else if (key === 'x' || key === 'Escape' || key === 'Backspace') {
    if (game?.pending?.forced || screen === 'main') return;
    e.preventDefault();
    keyboard = true; screen = 'main'; cursorKey = null; flash = ''; render();
  } else if (/^[1-4]$/.test(key) && game?.status === 'your_turn' && !game.pending?.forced) {
    e.preventDefault();
    keyboard = true;
    if (screen !== 'fight') { screen = 'fight'; render(); }
    const b = $('bottom').querySelector(`.m${Number(key) - 1}:not(:disabled)`);
    if (b) { focusButton(b); b.click(); }
  } else if (key === 'd' && screen === 'fight' && $('gimmick')) {
    e.preventDefault();
    keyboard = true; cycleGimmick(); render();
  }
});

    render(); setTimeout(() => { flash = ''; render(); }, 2200); return;
  }
  if (t.dataset.action) choose(t.dataset.action);
});

async function post(path, body) {
  sending = true; flash = ''; render();
  try {
    const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    const before = game?.status;
    game = data.game || null;
    onUpdate();
    if (game?.status === 'done' && before !== 'done') loadRecords();
    if (path === 'api/start') loadRecords();
    if (data.error) { $('note').textContent = data.error; $('note').className = 'err'; } else { $('note').textContent = ''; }
  } catch (e) { $('note').textContent = '서버에 닿지 못했습니다. PC의 대전 서버가 켜져 있는지 확인하세요.'; $('note').className = 'err'; }
  sending = false; render(); schedule();
}
function start() {
  justStarted = true;
  const p1 = checkEntry('p1'), p2 = checkEntry('p2');
  if (p1.errors.length || p2.errors.length) {
    $('note').className = 'err'; $('note').textContent = '엔트리에 고칠 곳이 있습니다. 빨간 줄을 확인하세요.';
    $('pick-p1').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  window.__last = null; screen = 'main'; gimmick = '';
  post('api/start', { p1: { sets: p1.sets }, p2: { sets: p2.sets } });
}
function choose(action) {
  if (!game?.pending || sending) return;
  screen = 'main'; gimmick = '';
  post('api/choose', { action, request: game.pending.request });
}

/* ---- Past battles: every battle the server kept, replayed turn by turn ---------------------------------------- */
let records = [], recordsShown = 8;
const whenOf = rid => `${rid.slice(4, 6)}-${rid.slice(6, 8)} ${rid.slice(9, 11)}:${rid.slice(11, 13)}`;
const teamText = list => list.length ? `${mon(list[0])}${list.length > 1 ? ` 외 ${list.length - 1}` : ''}` : '?';
async function loadRecords() {
  try { records = (await (await fetch('api/records', { cache: 'no-store' })).json()).records || []; }
  catch (e) { $('records').innerHTML = '<p class="err">지난 판 목록을 불러오지 못했습니다.</p>'; return; }
  renderRecords();
}
function badge(r) {
  if (r.status === 'live') return '<span class="badge live">진행 중</span>';
  if (r.status !== 'done') return '<span class="badge stop">중단</span>';
  return r.winner === 'p1' ? `<span class="badge win">승 · ${r.turn}턴</span>` : r.winner ? `<span class="badge lose">패 · ${r.turn}턴</span>` : `<span class="badge stop">무승부</span>`;
}
function renderRecords() {
  if (!records.length) { $('records').innerHTML = '<p class="dim">아직 저장된 판이 없습니다.</p>'; return; }
  $('records').innerHTML = `<div class="rec-list">${records.slice(0, recordsShown).map(r => `
    <button class="rec" data-record="${esc(r.id)}" ${r.status === 'live' ? 'disabled' : ''}>
      <span class="when">${esc(whenOf(r.id))}</span>
      <span class="teams">${esc(teamText(r.p1 || []))} <span class="dim">vs</span> ${esc(teamText(r.p2 || []))}</span>
      ${badge(r)}</button>`).join('')}</div>
    ${records.length > recordsShown ? `<p><button class="pm-button" id="more-records">더 보기 (${records.length - recordsShown})</button></p>` : ''}`;
}
async function openRecord(rid) {
  $('records').innerHTML = '<p class="dim">불러오는 중…</p>';
  let r;
  try { r = await (await fetch(`api/record?id=${encodeURIComponent(rid)}`, { cache: 'no-store' })).json(); }
  catch (e) { r = { error: '기록을 불러오지 못했습니다.' }; }
  if (r.error) { $('records').innerHTML = `<p class="err">${esc(r.error)}</p><p><button class="pm-button" id="back-records">← 목록</button></p>`; return; }
  // The log by turn: what happened in turn N follows its |turn|N marker; the boss's choice for turn N sits with it.
  const turns = [{ turn: 0, lines: [] }];
  for (const raw of r.log || []) {
    const t = /^\|turn\|(\d+)/.exec(raw);
    if (t) { turns.push({ turn: Number(t[1]), lines: [] }); continue; }
    const text = line(raw);
    if (text) turns[turns.length - 1].lines.push(text);
  }
  const byTurn = {};
  (r.decisions || []).forEach(d => (byTurn[d.turn] = byTurn[d.turn] || []).push(d));
  const result = r.status !== 'done' ? '중단된 판' : r.winner === 'p1' ? `이겼습니다 · ${r.turn}턴` : r.winner ? `졌습니다 · ${r.turn}턴` : '무승부';
  $('records').innerHTML = `<div class="replay">
    <div class="head"><button class="pm-button" id="back-records">← 목록</button><b>${esc(whenOf(r.id))}</b>${badge(r)}<span class="dim">${esc(result)}</span></div>
    <div class="files">${(r.files || []).map(f => `<a class="pm-button" href="api/record-file?id=${encodeURIComponent(r.id)}&name=${encodeURIComponent(f)}" download>${esc(f)} 받기</a>`).join('')}</div>
    ${setsBlock(r.teams)}
    ${turns.filter(t => t.lines.length || byTurn[t.turn]).map(t => `<h3>${t.turn ? `${t.turn}턴` : '시작'}</h3>
      <pre class="log">${esc(t.lines.join('\n'))}</pre>
      ${(byTurn[t.turn] || []).map(d => aiBlock(d)).join('')}`).join('')}
  </div>`;
  $('records').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('records').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.record) openRecord(b.dataset.record);
  else if (b.id === 'back-records') renderRecords();
  else if (b.id === 'more-records') { recordsShown += 8; renderRecords(); }
});

let timer = null;
function schedule() {
  clearTimeout(timer);
  const busy = game && ['starting', 'ai_thinking'].includes(game.status);
  timer = setTimeout(poll, busy ? 700 : 4000);
}
async function poll() {
  try {
    const data = await (await fetch('api/state', { cache: 'no-store' })).json();
    const before = [game?.status, game?.pending?.request, game?.id].join('|');
    const was = game?.status;
    game = data.game || null;
    const after = [game?.status, game?.pending?.request, game?.id].join('|');
    if (after !== before && !sending) {
      onUpdate();
      if (game?.status === 'done' && was !== 'done') loadRecords();
      if (game?.pending && game.pending.request !== shownRequest) { shownRequest = game.pending.request; screen = 'main'; gimmick = ''; }
      render();
    }
  } catch (e) { /* the next poll retries */ }
  schedule();
}

(async () => {
  try { N = await (await fetch('api/names')).json(); } catch (e) { /* English names then */ }
  try { game = (await (await fetch('api/state', { cache: 'no-store' })).json()).game || null; } catch (e) { $('note').textContent = '서버에 닿지 못했습니다.'; }
  if (game?.pending) shownRequest = game.pending.request;
  await setupEntries();
  if (game) seen = { id: game.id, len: (game.status === 'done' ? game.result?.log : game.pending?.log)?.length || 0 };
  render(); schedule();
  loadRecords();
})();
</script>
